version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        GO_VERSION: "1.22"
    working_dir: /src
    volumes:
      - .:/src
      - go-cache:/go/pkg/mod
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - db
    command: ["air", "-c", ".air.toml"]

  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        GO_VERSION: "1.22"
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        GO_VERSION: "1.22"
    working_dir: /src
    volumes:
      - .:/src
      - go-cache:/go/pkg/mod
    env_file:
      - .env
    depends_on:
      - db
    command: ["go", "run", "cmd/seed/main.go"]

volumes:
  pgdata:
  go-cache: