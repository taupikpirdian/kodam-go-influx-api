components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication
    ApiSecretAuth:
      type: apiKey
      in: header
      name: X-API-Secret
      description: API secret for validation
    IpWhitelist:
      type: apiKey
      in: header
      name: X-Forwarded-For
      description: IP address for whitelist validation (automatically handled)
    RateLimiting:
      type: apiKey
      in: header
      name: Rate-Limit
      description: Rate limiting (automatically handled, 30 requests per minute)

  parameters:
    ClientCode:
      name: client_code
      in: query
      description: Filter by client code
      required: false
      schema:
        type: string
        example: "kodam"
    StartTime:
      name: start
      in: query
      description: Start time in RFC3339 format
      required: false
      schema:
        type: string
        format: date-time
        example: "2025-11-08T00:00:00Z"
    EndTime:
      name: stop
      in: query
      description: End time in RFC3339 format
      required: false
      schema:
        type: string
        format: date-time
        example: "2025-11-08T23:59:59Z"
    Page:
      name: page
      in: query
      description: Page number for pagination
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
    Limit:
      name: limit
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 50
        example: 50

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, error]
          example: "ok"
      required:
        - status

    SensorDataRequest:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the sensor data in RFC3339 format
          example: "2025-11-08T16:31:00Z"
        client_code:
          type: string
          description: Client code identifier
          example: "kodam"
        json_data:
          type: string
          description: JSON string containing sensor-specific data
          example: '{"target_id": "T001", "speed": 120.5}'
      required:
        - timestamp
        - client_code
        - json_data

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        status:
          type: integer
          example: 200
        status_message:
          type: string
          example: "OK"
        message:
          type: string
          example: "Data stored successfully"
        data:
          type: object
          nullable: true
          example: null
      required:
        - success
        - status
        - status_message
        - message
        - data

    ListResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        code:
          type: integer
          example: 200
        message:
          type: string
          example: "Data retrieved successfully"
        data:
          type: array
          items:
            $ref: '#/components/schemas/ListItem'
          example:
            - timestamp: "2025-11-08T16:31:00Z"
              client_code: "kodam"
              json_data: '{"target_id": "T001", "speed": 120.5}'
        meta:
          $ref: '#/components/schemas/ListResponseMeta'
      required:
        - status
        - code
        - message
        - data
        - meta

    ListItem:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2025-11-08T16:31:00Z"
        client_code:
          type: string
          example: "kodam"
        json_data:
          type: string
          example: '{"target_id": "T001", "speed": 120.5}'
      required:
        - timestamp
        - client_code
        - json_data

    ListResponseMeta:
      type: object
      properties:
        count:
          type: integer
          description: Total number of items returned
          example: 50
        page:
          type: integer
          description: Current page number
          example: 1
        limit:
          type: integer
          description: Number of items per page
          example: 50
      required:
        - count
        - page
        - limit

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        status:
          type: integer
          example: 400
        status_message:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "Invalid request parameters"
        data:
          type: object
          nullable: true
          example: null
      required:
        - success
        - status
        - status_message
        - message
        - data

  responses:
    BadRequest:
      description: Bad request - invalid parameters or data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            status: 400
            status_message: "Bad Request"
            message: "Invalid request parameters"
            data: null

    Unauthorized:
      description: Unauthorized - invalid or missing API credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            status: 401
            status_message: "Unauthorized"
            message: "Invalid or missing API credentials"
            data: null

    TooManyRequests:
      description: Too many requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            status: 429
            status_message: "Too Many Requests"
            message: "Rate limit exceeded. Please try again later."
            data: null

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            status: 500
            status_message: "Internal Server Error"
            message: "An unexpected error occurred"
            data: null

# Example usage documentation
x-code-samples:
  $ref: '#/components/examples/CodeSamples'

components:
  examples:
    CodeSamples:
      type: object
      properties:
        curl:
          summary: cURL example for storing personel data
          value: |
            curl -X POST http://localhost:3000/api/sensors/personel \
              -H "Content-Type: application/json" \
              -H "X-API-Key: your-api-key" \
              -H "X-API-Secret: your-api-secret" \
              -d '{
                "timestamp": "2025-11-08T16:31:00Z",
                "client_code": "kodam",
                "json_data": "{\"person_id\":\"P12345\",\"name\":\"Sersan Budi\",\"location\":{\"latitude\":-6.917464,\"longitude\":107.619123},\"status\":\"active\"}"
              }'

        go:
          summary: Go example for retrieving personel data
          value: |
            package main

            import (
                "encoding/json"
                "fmt"
                "net/http"
            )

            func main() {
                url := "http://localhost:3000/api/sensors/personel/list?client_code=kodam&page=1&limit=10"
                req, _ := http.NewRequest("GET", url, nil)
                req.Header.Set("X-API-Key", "your-api-key")
                req.Header.Set("X-API-Secret", "your-api-secret")

                client := &http.Client{}
                resp, err := client.Do(req)
                if err != nil {
                    panic(err)
                }
                defer resp.Body.Close()

                var result map[string]interface{}
                json.NewDecoder(resp.Body).Decode(&result)
                fmt.Printf("%+v\n", result)
            }

        python:
          summary: Python example for retrieving radar data (streaming)
          value: |
            import requests
            import json

            url = "http://localhost:3000/api/sensors/radar?client_code=kodam"
            headers = {
                "X-API-Key": "your-api-key",
                "X-API-Secret": "your-api-secret"
            }

            response = requests.get(url, headers=headers, stream=True)
            response.raise_for_status()

            for line in response.iter_lines():
                if line:
                    data = json.loads(line.decode('utf-8'))
                    print(data)

# Security requirements
security:
  - ApiKeyAuth: []
  - ApiSecretAuth: []