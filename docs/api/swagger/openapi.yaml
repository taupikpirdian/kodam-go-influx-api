openapi: 3.0.3
info:
  title: KODAM InfluxDB API
  description: |
    API untuk menyimpan dan mengambil data sensor dari berbagai sumber (Personel, Radar, DF, ADSB) ke InfluxDB.

    ## Fitur
    - Mendukung multiple jenis sensor (Personel, Radar, DF, ADSB)
    - Streaming data real-time dengan format NDJSON
    - Pagination untuk endpoint list
    - Filter berdasarkan client code dan rentang waktu
    - Keamanan dengan API Key dan IP Whitelist
    - Rate limiting untuk mencegah abuse

    ## Authentication
    API menggunakan API Key dan API Secret yang harus dikirim melalui headers:
    - `X-API-Key`: API key untuk autentikasi
    - `X-API-Secret`: API secret untuk validasi

    ## Security
    - API Key authentication
    - IP Whitelist filtering
    - Rate limiting (30 requests per minute)
    - CORS configuration
  version: 1.0.0
  contact:
    name: KODAM API Team
    email: support@kodam.mil.id
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.kodam.mil.id
    description: Production server

tags:
  - name: Health
    description: Health check endpoints
  - name: Personel
    description: Personel sensor data management
  - name: Radar
    description: Radar sensor data management
  - name: DF
    description: DF (Direction Finding) sensor data management
  - name: ADSB
    description: ADSB (Automatic Dependent Surveillance-Broadcast) sensor data management
  - name: Test
    description: Testing endpoints

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description: Returns the health status of the API service
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok

  /api/sensors/personel:
    post:
      tags:
        - Personel
      summary: Store personel sensor data
      description: Store personel sensor data to InfluxDB measurement `personel_sensor`
      operationId: storePersonelData
      security:
        - ApiKeyAuth: []
        - IpWhitelist: []
        - RateLimiting: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorDataRequest'
            example:
              timestamp: "2025-11-08T16:31:00Z"
              client_code: "kodam"
              json_data: |
                {
                  "generated_at": "2025-11-08T16:31:00Z",
                  "reason": "personel_tracking",
                  "personnel": {
                    "P12345": {
                      "timestamp": 1699464660,
                      "serial_number": "SN001",
                      "identity": {
                        "id": "P12345",
                        "nrp": "123456789",
                        "name": "Sersan Budi",
                        "rank": "Sersan",
                        "unit": "Yonif 123",
                        "battalion": "Batalyon ABC",
                        "squad": "Regu 1",
                        "avatar": "https://example.com/avatar.jpg"
                      },
                      "gps": {
                        "latitude": -6.917464,
                        "longitude": 107.619123,
                        "gps_timestamp": 1699464660
                      },
                      "radio_health": {
                        "heartrate": 78,
                        "heartrate_timestamp": 1699464660
                      },
                      "battery": {
                        "level": 85
                      },
                      "_received_at": 1699464661
                    }
                  }
                }
      responses:
        '200':
          description: Data successfully stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                status: 200
                status_message: "OK"
                message: "Personel sensor data stored successfully"
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags:
        - Personel
      summary: Retrieve personel sensor data (streaming)
      description: Retrieve personel sensor data from InfluxDB with NDJSON streaming format
      operationId: getPersonelDataStreaming
      security:
        - ApiKeyAuth: []
        - IpWhitelist: []
        - RateLimiting: []
      parameters:
        - $ref: '#/components/parameters/ClientCode'
        - $ref: '#/components/parameters/StartTime'
        - $ref: '#/components/parameters/EndTime'
      responses:
        '200':
          description: Streaming data in NDJSON format
          content:
            application/x-ndjson:
              schema:
                type: string
                example: |
                  {"timestamp":"2025-11-08T16:31:00Z","client_code":"kodam","json_data":"{\"person_id\":\"P12345\",...}"}
                  {"timestamp":"2025-11-08T16:31:30Z","client_code":"kodam","json_data":"{\"person_id\":\"P12346\",...}"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

